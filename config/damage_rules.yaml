# กติกาจัดระดับความเสียหายจากพายุฤดูร้อน (ลม + ลูกเห็บ) — พฤษภาคม 2567
# ------------------------------------------------------------------------------------------------
# ตัวชี้วัดหลัก = จำนวนบ้านเรือนที่เสียหาย (หลังคาเรือน) — เป็นตัวเลข ทำซ้ำได้ ไม่ต้องตีความข้อความ
# กติกาเสริมทุกข้อด้านล่าง "กำหนดไว้ก่อนดูผลเรดาร์" และมีข้อความหลักฐานจากคอลัมน์หมายเหตุกำกับ
# แก้ไฟล์นี้แล้วรันบท 07 ใหม่ได้ทันที (ไม่ต้องแก้โค้ด)

# ระดับความเสียหาย (จำนวนบ้านเสียหาย, ช่วงปิดซ้าย [a, b))
classes:
  primary:          # การวิเคราะห์หลัก 3 ระดับ
    edges: [0, 50, 100, .inf]
    labels: [Weak, Moderate, Severe]
  robust4:          # ตรวจความทนทาน 4 ระดับ
    edges: [0, 10, 50, 100, .inf]
    labels: [Weak, Moderate, Strong, Severe]

analysis:
  main_days: [1, 20]          # ช่วงพายุฤดูร้อน (ก่อนประกาศเข้าฤดูฝน 21 พ.ค. 2567)
  event_link_hours: 2         # รายงานที่จับคู่กับเส้นทางเดียวกัน (หรือกลุ่มยอดรวมเดียวกัน) = เหตุการณ์เดียวกัน
  min_track_life_min: 30

# 1) แถวที่ไม่ใช่ภัยลม/ลูกเห็บ → ตัดออกจากการวิเคราะห์ (ยังเก็บในตาราง พร้อมเหตุผล)
exclude:
  R0506-07: {reason: "น้ำฝนล้นรางน้ำเข้าฝ้าเพดาน รพ.พนา — ฝนตกหนัก ไม่ใช่ความเสียหายจากลม"}
  R0513-03: {reason: "น้ำท่วมขังในเขตเทศบาลเมืองเลย — ฝนตกหนัก"}
  R0522-01: {reason: "น้ำป่าหลากเข้าโรงเรียน อ.ปากช่อง — ฝนตกหนักต่อเนื่อง"}
  R0531-01: {reason: "น้ำท่วมถนนในเมืองขอนแก่น — ฝนตกหนัก"}
  R0504-02: {reason: "ปลาตายในบึงละหานจากคลื่นลม/ตะกอน — ไม่ใช่ความเสียหายต่อสิ่งปลูกสร้าง"}

# 2) ผู้เสียชีวิตที่ไม่นับเป็นความรุนแรงของลม
casualty_not_wind:
  R0520-03: {reason: "ถูกฟ้าผ่าเสียชีวิต"}

# 3) ยอดรวมระดับจังหวัด (แยกรายอำเภอไม่ได้) → ใช้ที่ "ระดับเหตุการณ์" เท่านั้น
#    total = จำนวนบ้านทั้งกลุ่มตามข่าว; reports = แถวที่อยู่ในกลุ่ม
groups:
  LOEI_0503:
    total: 254
    reports: [R0503-20, R0503-21, R0503-22, R0503-24, R0503-25, R0503-26, R0503-27]
    evidence: "พายุฤดูร้อนพัดกระหน่ำใน 8 อำเภอ ... รวม 14 ตำบล 33 หมู่บ้าน 254 หลังคาเรือน"
  NONGKHAI_0503:
    total: 562
    reports: [R0503-08, R0503-09]
    evidence: "ในพื้นที่ 6 อำเภอ 19 ตำบล 75 หมู่บ้าน มีบ้านเรือนเสียหาย จำนวน 562 หลังคาเรือน (ท่าบ่อ 152, ศรีเชียงใหม่ 322)"

# 4) ยกระดับเป็น Severe แม้จำนวนบ้านน้อย: ผู้เสียชีวิตจากโครงสร้างพังเพราะลม / โครงสร้างขนาดใหญ่ล้ม
upgrade_severe:
  R0501-04: {evidence: "ถูกผนังบ้านพังทับลงมาเสียชีวิต"}
  R0503-02: {evidence: "อาคารแคมป์คนงานก่อสร้าง พังถล่มลงมา ... มีผู้เสียชีวิต 1 คน"}
  R0503-06: {evidence: "ลมกระโชกแรงนานกว่า 30 นาที ไฟฟ้าดับทั้งเมือง ... เครนล้มลงมาทับ ทั้ง 3 รายเสียชีวิต"}
  R0506-08: {evidence: "ถูกกำแพงบ้านถล่มทับ ... เสียชีวิต (บ้านเสียหายกว่า 100 หลัง)"}

# 5) จำนวนบ้านที่อ่านได้จากหมายเหตุเมื่อคอลัมน์ว่าง (ไม่มีในเดือนนี้ — ใส่รูปแบบไว้เป็นตัวอย่าง)
#    R0xxx-yy: {houses: 12, evidence: "..."}
houses_from_note: {}

# 6) ไม่ทราบจำนวนบ้าน (ไม่มีตัวเลขในข่าว) — การวิเคราะห์หลัก: ตัดออก | ตรวจความทนทาน: กำหนดเป็น Weak
#    R0501-01, R0501-03 (สกลนคร: "ไม่พบรายงานจำนวนบ้านเรือนที่เสียหาย"), R0503-01, R0503-03 (ขอนแก่น),
#    R0513-01 (สระใคร: "สังกะสีหลุดหายไปหลายหลัง เสาไฟฟ้าหักโค่น"), R0505-16 (วารินชำราบ, นอกรัศมี)
